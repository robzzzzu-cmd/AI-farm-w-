name: Automated Market Analysis & Site Deploy

on:
  schedule:
    # 14:35 UTC: 35 mins after US Market Open (Mon-Fri) - avoids top-of-hour GitHub Action queue drops
    - cron: '30 14 * * 1-5'
    # 20:15 UTC: 15 mins after US Market Close (Mon-Fri) - captures closing auction liquidity
    - cron: '15 20 * * 1-5'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - '.gitignore'

permissions:
  contents: write

concurrency:
  group: "market-analysis"
  cancel-in-progress: false

jobs:
  analyze-market:
    # Run data collection ONLY on cron schedules or manual trigger
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run market analysis script
        id: run_script
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node index.js

      - name: Dispatch Daily Newsletter Broadcast
        if: success()
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          npm install resend
          node scripts/send-broadcast.mjs

      - name: Send Failure Webhook Alert
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{
                   "content": "🚨 **Pipeline Failure Alert**",
                   "embeds": [{
                     "title": "Market Analysis Generation Failed",
                     "color": 15158332,
                     "description": "The market intelligence generator failed during step execution. Possible causes: Alpha Vantage API limit, Gemini API downtime, or invalid response payload.",
                     "fields": [
                       {"name": "Repository", "value": "${{ github.repository }}", "inline": true},
                       {"name": "Trigger", "value": "${{ github.event_name }}", "inline": true},
                       {"name": "Run Log", "value": "[View Run #${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false}
                     ],
                     "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
                   }]
                 }' \
                 "$ALERT_WEBHOOK_URL"
          else
            echo "ALERT_WEBHOOK_URL secret not configured. Skipping alert notification."
          fi

      - name: Commit and push new market update
        if: success()
        run: |
          git config --global user.name "Market AI Bot"
          git config --global user.email "bot@tradeopportunities.trade"
          git add short-series/src/content/blog/
          if git diff --staged --quiet; then
            echo "No new changes to commit"
          else
            git commit -m "chore(intel): automated market scan"
            git pull --rebase origin main
            git push
          fi

      - name: Trigger Vercel Production Deployment
        if: success()
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -X POST "$VERCEL_DEPLOY_HOOK"
          else
            echo "VERCEL_DEPLOY_HOOK not configured. Skipping explicit webhook deploy trigger."
          fi
