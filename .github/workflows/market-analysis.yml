name: Automated Market Analysis & Site Deploy

on:
  schedule:
    # 13:41 UTC: ~11 mins after US Market Open (Opening breakout surge)
    - cron: '41 13 * * 1-5'
    # 16:23 UTC: Midday liquidity transition
    - cron: '23 16 * * 1-5'
    # 18:17 UTC: Afternoon rotation & volume concentration
    - cron: '17 18 * * 1-5'
    # 20:08 UTC: ~8 mins after US Market Close (Closing auction liquidity)
    - cron: '08 20 * * 1-5'
  workflow_dispatch:
    inputs:
      cadence:
        description: 'Target Brief Cadence'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - morning
          - midday
          - afternoon
          - closing
      force:
        description: 'Force generation even if brief already exists today'
        required: false
        default: false
        type: boolean
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - '.gitignore'

permissions:
  contents: write

concurrency:
  group: "market-analysis"
  cancel-in-progress: false

jobs:
  analyze-market:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run market analysis script
        id: run_script
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          POLYGON_API: ${{ secrets.POLYGON_API }}
          FINHUB_API: ${{ secrets.FINHUB_API }}
          FINNHUB_API: ${{ secrets.FINNHUB_API }}
          SCHEDULE_CRON: ${{ github.event.schedule }}
          CADENCE_OVERRIDE: ${{ github.event.inputs.cadence }}
          INPUT_FORCE: ${{ github.event.inputs.force }}
        run: node index.js

      - name: Dispatch Daily Newsletter Broadcast
        if: success() && steps.run_script.outputs.has_new_post == 'true'
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          npm install --no-save resend
          node scripts/send-broadcast.mjs

      - name: Send Failure Webhook Alert
        if: failure()
        env:
          ALERT_WEBHOOK_URL: ${{ secrets.ALERT_WEBHOOK_URL }}
        run: |
          if [ -n "$ALERT_WEBHOOK_URL" ]; then
            curl -H "Content-Type: application/json" \
                 -X POST \
                 -d '{
                   "content": "🚨 **Pipeline Failure Alert**",
                   "embeds": [{
                     "title": "Market Analysis Generation Failed",
                     "color": 15158332,
                     "description": "The market intelligence generator failed during step execution. Possible causes: Alpha Vantage API limit, Gemini API downtime, or invalid response payload.",
                     "fields": [
                       {"name": "Repository", "value": "${{ github.repository }}", "inline": true},
                       {"name": "Trigger", "value": "${{ github.event_name }}", "inline": true},
                       {"name": "Run Log", "value": "[View Run #${{ github.run_id }}](https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }})", "inline": false}
                     ],
                     "timestamp": "'$(date -u +%Y-%m-%dT%H:%M:%SZ)'"
                   }]
                 }' \
                 "$ALERT_WEBHOOK_URL"
          else
            echo "ALERT_WEBHOOK_URL secret not configured. Skipping alert notification."
          fi

      - name: Commit and push new market update
        if: success()
        run: |
          git config --global user.name "Market AI Bot"
          git config --global user.email "bot@tradeopportunities.trade"
          git add short-series/src/content/blog/
          if git diff --staged --quiet; then
            echo "No new changes to commit"
          else
            git commit -m "chore(intel): automated market scan"
            git checkout -- .
            git pull --rebase --autostash origin main
            git push
          fi

      - name: Trigger Vercel Production Deployment
        if: success() && steps.run_script.outputs.has_new_post == 'true'
        env:
          VERCEL_DEPLOY_HOOK: ${{ secrets.VERCEL_DEPLOY_HOOK }}
        run: |
          if [ -n "$VERCEL_DEPLOY_HOOK" ]; then
            curl -X POST "$VERCEL_DEPLOY_HOOK"
          else
            echo "VERCEL_DEPLOY_HOOK not configured. Skipping explicit webhook deploy trigger."
          fi
