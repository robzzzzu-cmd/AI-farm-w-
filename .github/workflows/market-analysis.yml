name: Automated Market Analysis & Site Deploy

on:
  schedule:
    # 14:30 UTC: US Market Open (Opening Momentum Scan)
    - cron: '30 14 * * 1-5'
    # 21:00 UTC: US Market Close (Daily Summary)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - '.gitignore'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  analyze-market:
    # Only run data fetching on scheduled cron or manual button click
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: |
          if [ -f package.json ]; then npm ci || npm install; fi

      - name: Run market analysis
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        # Runs index.ts directly via tsx, or fallback to index.js if compiled
        run: |
          if [ -f index.ts ]; then
            npx --yes tsx index.ts
          else
            node index.js
          fi

      - name: Commit and push new market dispatch
        run: |
          git config --global user.name "Market AI Bot"
          git config --global user.email "bot@tradeopportunities.trade"
          git add short-series/src/content/blog/
          if git diff --staged --quiet; then
            echo "No new market updates to commit."
          else
            git commit -m "chore(intel): automated market scan [skip ci]"
            git pull --rebase origin main
            git push
          fi

  deploy-site:
    # Runs after market analysis, OR immediately on standard code pushes
    needs: analyze-market
    if: always() && (needs.analyze-market.result == 'success' || needs.analyze-market.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install, build, and upload site
        uses: withastro/action@v3
        with:
          path: ./short-series
          node-version: '22'
          package-manager: npm

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
