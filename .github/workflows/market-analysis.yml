name: Automated Market Analysis

on:
  schedule:
    - cron: '0 21 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  analyze-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Run market analysis script
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: node index.js

      - name: Commit and push new market update
        run: |
          git config --global user.name "Market AI Bot"
          git config --global user.email "bot@example.com"
          git add content/
          git commit -m "Automated market update for $(date +'%Y-%m-%d')" || exit 0
          git push
