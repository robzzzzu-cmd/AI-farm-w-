name: Automated Market Analysis

on:
  schedule:
    # Runs Monday to Friday at 21:00 UTC
    - cron: '0 21 * * 1-5'
  workflow_dispatch: # Allows you to trigger it manually from the Actions tab

jobs:
  analyze-and-publish:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24' # Node 18+ includes the native fetch API

      - name: Run market analysis script
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: node index.js
