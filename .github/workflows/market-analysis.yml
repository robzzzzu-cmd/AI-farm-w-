name: Automated Market Analysis & Site Deploy

on:
  schedule:
    # 14:30 UTC: US Market Opening Bell Scan (Mon-Fri)
    - cron: '30 14 * * 1-5'
    # 21:00 UTC: US Market Closing Bell Summary (Mon-Fri)
    - cron: '0 21 * * 1-5'
  workflow_dispatch:
  push:
    branches: ["main"]
    paths-ignore:
      - 'README.md'
      - '.gitignore'

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  analyze-market:
    # Run data collection ONLY on cron schedules or manual trigger
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Run market analysis script
        env:
          ALPHA_VANTAGE_API_KEY: ${{ secrets.ALPHA_VANTAGE_API_KEY }}
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
        run: node index.js

      - name: Commit and push new market update
        run: |
          git config --global user.name "Market AI Bot"
          git config --global user.email "bot@tradeopportunities.trade"
          git add short-series/src/content/blog/
          if git diff --staged --quiet; then
            echo "No new changes to commit"
          else
            git commit -m "chore(intel): automated market scan [skip ci]"
            git pull --rebase origin main
            git push
          fi

  deploy-site:
    needs: analyze-market
    # Runs after analysis, OR immediately if triggered by a code commit
    if: always() && (needs.analyze-market.result == 'success' || needs.analyze-market.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          path: ./short-series
          node-version: '22'
          package-manager: npm

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
