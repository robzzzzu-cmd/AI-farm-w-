<!-- short-series/public/favicon.svg -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" fill="none">
  <defs>
    <linearGradient id="brandGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#2563eb" />
      <stop offset="50%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#22c55e" />
    </linearGradient>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b0f19" />
      <stop offset="100%" stop-color="#020617" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Base Icon Tile -->
  <rect width="128" height="128" rx="28" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="4" />

  <!-- Sub-grid accent lines -->
  <line x1="20" y1="96" x2="108" y2="96" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4" />
  <line x1="20" y1="64" x2="108" y2="64" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4" />
  <line x1="20" y1="32" x2="108" y2="32" stroke="#1e293b" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Momentum Candlesticks / Growth Wave -->
  <rect x="28" y="68" width="12" height="28" rx="3" fill="#38bdf8" opacity="0.6" />
  <line x1="34" y1="58" x2="34" y2="102" stroke="#38bdf8" stroke-width="2.5" opacity="0.6" />

  <rect x="52" y="48" width="12" height="48" rx="3" fill="#38bdf8" opacity="0.85" />
  <line x1="58" y1="38" x2="58" y2="102" stroke="#38bdf8" stroke-width="2.5" opacity="0.85" />

  <rect x="76" y="26" width="14" height="70" rx="3" fill="url(#brandGrad)" filter="url(#glow)" />
  <line x1="83" y1="16" x2="83" y2="104" stroke="#22c55e" stroke-width="3" />

  <!-- Breakout Impulse Dot -->
  <circle cx="102" cy="24" r="7" fill="#22c55e" filter="url(#glow)" />
</svg>

